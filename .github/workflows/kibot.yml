name: KiBot

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kibot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kibot:
    runs-on: ubuntu-latest
    # KiBot 1.9.1 with KiCad 10.0.5. Bump deliberately, together with the KiCad version in the README.
    container: ghcr.io/inti-cmnb/kicad10_auto_full:1.9.1-1_k10.0.5_d13.2_b4.2.4LTS
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff outputs check out the base commit
          fetch-depth: 0

      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Pick the diff base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          else
            base="HEAD~1"
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          echo "Diff base: $base"

      - name: Schematic (ERC, PDF, diff, netlist, BOM)
        run: kibot -c kibot/sch.kibot.yaml -e DS2000.kicad_sch -d kibot-out -E BASE=${{ steps.base.outputs.ref }}

      - name: Board (DRC, diff)
        if: hashFiles('DS2000.kicad_pcb') != ''
        run: kibot -c kibot/pcb.kibot.yaml -b DS2000.kicad_pcb -e DS2000.kicad_sch -d kibot-out -E BASE=${{ steps.base.outputs.ref }}

      # Two variants of the same board: economic (JLC assembles the top only, J1 by hand) and
      # standard (JLC also fits J1). The STEP keeps J1 for the enclosure, so it comes from standard.
      - name: Fabrication, economic variant (JLCPCB gerbers, drill, BOM, CPL)
        if: hashFiles('DS2000.kicad_pcb') != ''
        run: kibot -c kibot/fab.kibot.yaml -b DS2000.kicad_pcb -e DS2000.kicad_sch --variant economic -d kibot-out/economic _JLCPCB _JLCPCB_compress

      - name: Fabrication, standard variant (with J1) and STEP
        if: hashFiles('DS2000.kicad_pcb') != ''
        run: kibot -c kibot/fab.kibot.yaml -b DS2000.kicad_pcb -e DS2000.kicad_sch --variant standard -d kibot-out/standard _JLCPCB _JLCPCB_compress step

      - name: Production panel (2 x 2, economic)
        if: hashFiles('DS2000.kicad_pcb') != ''
        run: |
          kibot -c kibot/panel.kibot.yaml -b DS2000.kicad_pcb -e DS2000.kicad_sch -d kibot-out panel
          panel=$(ls kibot-out/panel/*.kicad_pcb | head -n1)
          kibot -c kibot/panel.kibot.yaml -b "$panel" -d kibot-out/panel _JLCPCB_fab _JLCPCB_position _JLCPCB_compress
          python3 tools/bom/panel_bom.py kibot-out/economic/JLCPCB/DS2000_bom_jlc.csv \
            kibot-out/panel/JLCPCB/$(basename "$panel" .kicad_pcb)_cpl_jlc.csv \
            kibot-out/panel/JLCPCB/$(basename "$panel" .kicad_pcb)_bom_jlc.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kibot-out
          path: kibot-out
          if-no-files-found: warn
