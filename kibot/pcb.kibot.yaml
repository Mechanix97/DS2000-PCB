# Board checks and documentation. CI only runs this config when a .kicad_pcb exists.
# The diff base is passed by CI with `-E BASE=<git ref>`.
kibot:
  version: 1

preflight:
  drc:
    format: HTML,RPT
    schematic_parity: true
    # Rev A is DRC-clean: any new error fails the job. The known warnings (TrueType text
    # thickness, J1/Y1 footprints edited on the board) are reported but do not fail it.
    dont_stop: false

outputs:
  - name: pcb_diff
    comment: Visual layout diff against the base of the change
    type: diff
    dir: diff
    options:
      pcb: true
      old: '@BASE@'
      old_type: git
      only_different: true
