# Board checks and documentation. CI only runs this config when a .kicad_pcb exists.
# The diff base is passed by CI with `-E BASE=<git ref>`.
kibot:
  version: 1

preflight:
  drc:
    format: HTML,RPT
    schematic_parity: true
    # The layout still has known violations (DS2000-PCB#14). Report them without failing
    # the job; switch this to false once rev A is DRC-clean.
    dont_stop: true

outputs:
  - name: pcb_diff
    comment: Visual layout diff against the base of the change
    type: diff
    dir: diff
    options:
      pcb: true
      old: '@BASE@'
      old_type: git
      only_different: true
